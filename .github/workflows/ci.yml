name: Backend Quality Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Black
        run: black --check app tests

      - name: Run isort
        run: isort --check-only app tests

      - name: Run Flake8
        run: flake8 app tests

      - name: Run Pylint
        run: pylint app

      - name: Run MyPy
        run: mypy app

      - name: Run Bandit
        run: bandit -r app

      - name: Run Pytest
        run: pytest